<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMBC</title>
<style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     user-select: none;
     -webkit-user-select: none;
   }
   html, body {
     width: 100%;
     height: 100%;
     background-color: #1C4733;
     overflow: hidden;
     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
   }

   /* 画面全体のコンテナ */
   .app-container {
     position: fixed;
     top: 0;
     left: 0;
     width: 100vw;
     height: 100vh;
     background-color: #1C4733;
     overflow: hidden;
   }

   /* 上部固定ヘッダー */
   .header-fixed {
     position: absolute;
     top: 0;
     left: 0;
     width: 100%;
     height: calc(37px + env(safe-area-inset-top));
     padding-top: env(safe-area-inset-top);
     background: #1C4733 url('header.jpg') no-repeat center top;
     background-size: 100% auto;
     z-index: 30;
     pointer-events: none;
   }
   .header-fixed * {
     pointer-events: auto;
   }

   /* ヘッダー内のiPhone風ステータスバー時計 */
   .ios-status-clock {
     position: absolute;
     top: calc(env(safe-area-inset-top) - 40px);
     left: 40px;
     color: #ffffff;
     font-size: 16px;
     font-weight: 600;
     letter-spacing: -0.3px;
   }

   /* 中央スクロール領域 */
   .scroll-content {
     position: absolute;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     overflow-y: auto;
     -webkit-overflow-scrolling: touch;
     padding-top: calc(37px + env(safe-area-inset-top));
     padding-bottom: calc(70px + env(safe-area-inset-bottom));
     z-index: 10;
   }

   .scroll-wrapper {
     position: relative;
     width: 100%;
   }

   /* 画像本体を全幅で配置 */
   .scroll-image {
     display: block;
     width: 100%;
     height: auto;
   }

   /* 「現在」の横に配置するエリア内時計 */
   .content-clock {
     position: absolute;
     top: 22px; 
     right: 54px; 
     color: #ffffff;
     font-size: 13.5px;
     font-weight: 400;
     opacity: 1.0;
     z-index: 15;
   }

   /* 残高の白いボックス用のクリックエリア（調整用黄色枠付き） */
   .account-box-link {
     position: absolute;
     top: 60px;
     left: 4%;
     width: 92%;
     height: 100px;
     background-color: rgba(255, 255, 0, 0.35); /* 半透明の黄色 */
     border: 2px solid #ffff00;                  /* 黄色の枠線 */
     z-index: 20;
     cursor: pointer;
   }

   /* 下部固定フッター */
   .footer-fixed {
     position: absolute;
     bottom: 0;
     left: 0;
     width: 100%;
     background-color: transparent;
     z-index: 30;
     pointer-events: none; 
   }

   .footer-image {
     display: block;
     width: 100%;
     height: auto;
     pointer-events: auto; 
   }

   /* フッターの左側（ホームアイコン）用のクリックエリア（調整用黄色枠付き） */
   .footer-home-link {
     position: absolute;
     bottom: 0px;
     left: 0;
     width: 20%;  
     height: 60px; 
     background-color: rgba(255, 255, 0, 0.35); /* 半透明の黄色 */
     border: 2px solid #ffff00;                  /* 黄色の枠線 */
     z-index: 40;
     pointer-events: auto;
     cursor: pointer;
   }

   /* iPhone下部ホームインジケータ（バー）の裏側の白背景埋め */
   .footer-fixed::after {
     content: "";
     position: absolute;
     bottom: 0;
     left: 0;
     width: 100%;
     height: env(safe-area-inset-bottom);
     background-color: #ffffff;
     z-index: -1;
   }
</style>
</head>
<body>

<div class="app-container">
  <!-- 上部固定ヘッダー -->
  <div class="header-fixed">
    <div class="ios-status-clock" id="ios-status-clock">00:00</div>
  </div>

  <!-- スクロール可能領域 -->
  <div class="scroll-content" id="scroll-container">
    <div class="scroll-wrapper">
      <img src="content.jpg?v=2" alt="content" class="scroll-image" id="content-img">
      <!-- 「現在」左側のリアルタイム時計 -->
      <div class="content-clock" id="content-clock">00:00</div>

      <!-- 残高の白いボックス（クリックで content2.jpg へ切り替え） -->
      <a href="#" class="account-box-link" id="switch-trigger"></a>
    </div>
  </div>

  <!-- 下部固定フッター -->
  <div class="footer-fixed">
    <img src="footer.png" alt="footer" class="footer-image">
    <!-- フッター左側のホームボタン用クリックエリア -->
    <a href="#" class="footer-home-link" id="home-trigger"></a>
  </div>
</div>

<script>
   // リアルタイム時計の更新
   function updateClock() {
     const now = new Date();
     const hours = String(now.getHours()).padStart(2, '0');
     const minutes = String(now.getMinutes()).padStart(2, '0');
     const timeStr = `${hours}:${minutes}`;

     document.getElementById('ios-status-clock').textContent = timeStr;
     document.getElementById('content-clock').textContent = timeStr;
   }
   setInterval(updateClock, 1000);
   updateClock();

   const img = document.getElementById('content-img');
   const contentClock = document.getElementById('content-clock');
   const accountBox = document.getElementById('switch-trigger');

   // 残高ボックスクリック：content2.jpgへ切り替え＆時計非表示
   accountBox.addEventListener('click', function(e) {
     e.preventDefault();
     img.src = 'content2.jpg?v=1';
     contentClock.style.display = 'none';
   });

   // ホームボタン（フッター左側）クリック：content.jpgに戻る＆時計再表示
   document.getElementById('home-trigger').addEventListener('click', function(e) {
     e.preventDefault();
     img.src = 'content.jpg?v=2';
     contentClock.style.display = 'block';
   });
</script>
</body>
</html>
