<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 画面の端（ノッチ・ステータスバー領域含む）まで広げる設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- フルスクリーン（アプリモード）起動の設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMBC</title>
<style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     user-select: none;
     -webkit-user-select: none;
   }
   html, body {
     width: 100%;
     height: 100%;
     background-color: #01381b; /* SMBCの緑色 */
     overflow: hidden;
     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", sans-serif;
   }
   /* 画面全体を覆う背景コンテナ */
   .app-container {
     position: relative;
     width: 100vw;
     height: 100vh;
     background: url('bg.jpg') no-repeat center top;
     background-size: cover;
   }
   /* 左上ステータスバーの時計（iOSのセーフエリア変数を使用） */
   .status-clock {
     position: absolute;
     /* env(safe-area-inset-top)を使うことで、ノッチやダイナミックアイランドを避けた正確な位置に配置できます */
     top: max(env(safe-area-inset-top), 12px);
     left: 24px;
     color: #ffffff;
     font-size: 15px;
     font-weight: 600;
     letter-spacing: -0.2px;
     z-index: 10;
   }
   /* 右上「更新日時」の時計（％指定またはvw指定にすると、画面サイズが変わってもズレにくくなります） */
   .app-clock {
     position: absolute;
     top: 22.4vh; /* px固定よりもvh（ビューポートハイト）を使うとiPhoneの機種ごとのズレを防げます */
     right: 18vw;
     color: #ffffff;
     font-size: 13px;
     font-weight: 400;
     opacity: 0.9;
     z-index: 10;
   }
</style>
</head>
<body>
<div class="app-container">
  <!-- リアルタイム更新用テキスト -->
  <div class="status-clock" id="status-clock">00:00</div>
  <div class="app-clock" id="app-clock">00:00</div>
</div>
<script>
   function updateClock() {
     const now = new Date();
     const hours = String(now.getHours()).padStart(2, '0');
     const minutes = String(now.getMinutes()).padStart(2, '0');
     const timeStr = `${hours}:${minutes}`;
     document.getElementById('status-clock').textContent = timeStr;
     document.getElementById('app-clock').textContent = timeStr;
   }
   // 1秒ごとに現在時刻に更新
   setInterval(updateClock, 1000);
   updateClock();
</script>
</body>
</html>
