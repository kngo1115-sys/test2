<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMBC</title>
<style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     user-select: none;
     -webkit-user-select: none;
   }
   html, body {
     width: 100%;
     height: 100%;
     background-color: #1C4733;
     overflow: hidden;
     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
   }

   /* 画面全体のコンテナ */
   .app-container {
     position: fixed;
     top: 0;
     left: 0;
     width: 100vw;
     height: 100vh;
     background-color: #1C4733;
     overflow: hidden;
   }

   /* 上部固定ヘッダー */
   .header-fixed {
     position: absolute;
     top: 0;
     left: 0;
     width: 100%;
     height: calc(37px + env(safe-area-inset-top));
     padding-top: env(safe-area-inset-top);
     background: #1C4733 url('header.jpg') no-repeat center top;
     background-size: 100% auto;
     z-index: 30;
     pointer-events: none;
   }
   .header-fixed * {
     pointer-events: auto;
   }

   /* ヘッダー内のiPhone風ステータスバー時計 */
   .ios-status-clock {
     position: absolute;
     top: calc(env(safe-area-inset-top) - 40px);
     left: 40px;
     color: #ffffff;
     font-size: 16px;
     font-weight: 600;
     letter-spacing: -0.3px;
   }

   /* 中央スクロール領域 */
   .scroll-content {
     position: absolute;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     overflow-y: auto;
     -webkit-overflow-scrolling: touch;
     padding-top: calc(37px + env(safe-area-inset-top));
     padding-bottom: calc(70px + env(safe-area-inset-bottom));
     z-index: 10;
   }

   .scroll-wrapper {
     position: relative;
     width: 100%;
   }

   /* 画像本体を全幅で配置 */
   .scroll-image {
     display: block;
     width: 100%;
     height: auto;
   }

   /* 「現在」の横に配置するエリア内時計 */
   .content-clock {
     position: absolute;
     top: 22px; 
     right: 54px; 
     color: #ffffff;
     font-size: 13.5px;
     font-weight: 400;
     opacity: 1.0;
     z-index: 15;
   }

   /* 残高の白いボックス用のクリックエリア */
   .account-box-link {
     position: absolute;
     top: 40px;
     left: 4%;
     width: 92%;
     height: 100px;
     /* background-color: rgba(255, 0, 0, 0.3); ※位置調整時はコメントアウトを外すと赤く表示されます */
     z-index: 20;
     cursor: pointer;
   }

   /* 下部固定フッター */
   .footer-fixed {
     position: absolute;
     bottom: 0;
     left: 0;
     width: 100%;
     background-color: transparent;
     z-index: 30;
     pointer-events: none; 
   }

   .footer-image {
     display: block;
     width: 100%;
     height: auto;
     pointer-events: auto; 
   }

   /* iPhone下部ホームインジケータ（バー）の裏側の白背景埋め */
   .footer-fixed::after {
     content: "";
     position: absolute;
     bottom: 0;
     left: 0;
     width: 100%;
     height: env(safe-area-inset-bottom);
     background-color: #ffffff;
     z-index: -1;
   }
</style>
</head>
<body>

<div class="app-container">
  <!-- 上部固定ヘッダー -->
  <div class="header-fixed">
    <div class="ios-status-clock" id="ios-status-clock">00:00</div>
  </div>

  <!-- スクロール可能領域 -->
  <div class="scroll-content" id="scroll-container">
    <div class="scroll-wrapper">
      <!-- 画像にid="content-img"を付与 -->
      <img src="content.jpg?v=2" alt="content" class="scroll-image" id="content-img">
      <!-- 「現在」左側のリアルタイム時計 -->
      <div class="content-clock" id="content-clock">00:00</div>

      <!-- 残高の白いボックス用のリンク（クリックで画像を切り替え） -->
      <a href="#" class="account-box-link" id="switch-trigger"></a>
    </div>
  </div>

  <!-- 下部固定フッター -->
  <div class="footer-fixed">
    <img src="footer.png" alt="footer" class="footer-image">
  </div>
</div>

<script>
   // リアルタイム時計の更新
   function updateClock() {
     const now = new Date();
     const hours = String(now.getHours()).padStart(2, '0');
     const minutes = String(now.getMinutes()).padStart(2, '0');
     const timeStr = `${hours}:${minutes}`;

     document.getElementById('ios-status-clock').textContent = timeStr;
     document.getElementById('content-clock').textContent = timeStr;
   }
   setInterval(updateClock, 1000);
   updateClock();

   // クリック時に画像を content.jpg と content2.jpg で切り替える処理
   document.getElementById('switch-trigger').addEventListener('click', function(e) {
     e.preventDefault(); // ページが上にジャンプするのを防ぐ
     const img = document.getElementById('content-img');
     const container = document.getElementById('scroll-container');

     if (img.src.includes('content2.jpg')) {
       // 現在が content2.jpg なら元の content.jpg に戻す
       img.src = 'content.jpg?v=2';
     } else {
       // それ以外なら content2.jpg に切り替える
       img.src = 'content2.jpg?v=1';
     }

     // 画像切り替え時にスクロール位置を一番上に戻したい場合は、以下のコメントアウトを外してください
     // container.scrollTop = 0;
   });
</script>
</body>
</html>
