<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMBC</title>
<style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     user-select: none;
     -webkit-user-select: none;
   }
   html, body {
     width: 100%;
     height: 100%;
     /* 背景色を指定色 #1C4733 に設定 */
     background-color: #1C4733;
     overflow: hidden;
     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
   }

   /* 画面全体のコンテナ */
   .app-container {
     position: fixed;
     top: 0;
     left: 0;
     width: 100vw;
     height: 100vh;
     background-color: #1C4733;
     overflow: hidden;
   }

   /* 上部固定ヘッダー（高さを小さく調整） */
   .header-fixed {
     position: absolute;
     top: 0;
     left: 0;
     width: 100%;
     /* 赤枠部分の幅（縦幅）を減らすため、180px から 90px に変更 */
     height: calc(90px + env(safe-area-inset-top));
     padding-top: env(safe-area-inset-top);
     background: #1C4733 url('header.jpg') no-repeat center top;
     background-size: 100% auto;
     z-index: 30;
     pointer-events: none;
   }
   .header-fixed * {
     pointer-events: auto;
   }

   /* ヘッダー内のiPhone風ステータスバー時計 */
   .ios-status-clock {
     position: absolute;
     top: calc(env(safe-area-inset-top) + 2px);
     left: 32px;
     color: #ffffff;
     font-size: 15px;
     font-weight: 600;
     letter-spacing: -0.3px;
   }

   /* 中央スクロール領域（上部余白を小さく変更） */
   .scroll-content {
     position: absolute;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     overflow-y: auto;
     -webkit-overflow-scrolling: touch;
     /* ヘッダーの高さ縮小に合わせて padding-top も 90px に調整 */
     padding-top: calc(90px + env(safe-area-inset-top));
     padding-bottom: calc(70px + env(safe-area-inset-bottom));
     z-index: 10;
   }

   .scroll-bg {
     width: 100%;
     min-height: 130%;
     background: #1C4733 url('content.jpg') no-repeat center top;
     background-size: 100% auto;
     position: relative;
   }

   /* 下部固定フッター */
   .footer-fixed {
     position: absolute;
     bottom: 0;
     left: 0;
     width: 100%;
     background-color: transparent;
     z-index: 30;
     pointer-events: none; 
   }

   .footer-image {
     display: block;
     width: 100%;
     height: auto;
     pointer-events: auto; 
   }

   /* iPhone下部ホームインジケータ（バー）の裏側の白背景埋め */
   .footer-fixed::after {
     content: "";
     position: absolute;
     bottom: 0;
     left: 0;
     width: 100%;
     height: env(safe-area-inset-bottom);
     background-color: #ffffff;
     z-index: -1;
   }
</style>
</head>
<body>

<div class="app-container">
  <!-- 上部固定ヘッダー -->
  <div class="header-fixed">
    <div class="ios-status-clock" id="ios-status-clock">00:00</div>
  </div>

  <!-- スクロール可能領域 -->
  <div class="scroll-content">
    <div class="scroll-bg"></div>
  </div>

  <!-- 下部固定フッター -->
  <div class="footer-fixed">
    <img src="footer.png" alt="footer" class="footer-image">
  </div>
</div>

<script>
   function updateClock() {
     const now = new Date();
     const hours = String(now.getHours()).padStart(2, '0');
     const minutes = String(now.getMinutes()).padStart(2, '0');
     const timeStr = `${hours}:${minutes}`;
     document.getElementById('ios-status-clock').textContent = timeStr;
   }
   setInterval(updateClock, 1000);
   updateClock();
</script>
</body>
</html>
