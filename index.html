<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMBC</title>
<style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     user-select: none;
     -webkit-user-select: none;
   }
   html, body {
     width: 100%;
     height: 100%;
     background-color: #01381b;
     overflow: hidden;
     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", sans-serif;
   }

   /* 画面全体のレイアウトコンテナ */
   .app-container {
     position: fixed;
     top: 0;
     left: 0;
     width: 100vw;
     height: 100vh;
     display: flex;
     flex-direction: column;
   }

   /* 上部固定エリア（赤色エリア相当：ヘッダー） */
   .header-fixed {
     width: 100%;
     height: calc(180px + env(safe-area-inset-top)); /* ヘッダー画像の高さに合わせて調整 */
     padding-top: env(safe-area-inset-top);
     background: url('header.jpg') no-repeat center top;
     background-size: 100% auto;
     flex-shrink: 0;
     z-index: 20;
   }

   /* スクロールする中央エリア（黄色エリア相当） */
   .scroll-content {
     flex: 1;
     overflow-y: auto;
     -webkit-overflow-scrolling: touch;
     position: relative;
     width: 100%;
   }

   /* スクロールエリア内の背景・コンテンツ */
   .scroll-bg {
     width: 100%;
     min-height: 150%; /* スクロールさせるための高さ */
     background: url('content.jpg') no-repeat center top;
     background-size: 100% auto;
     position: relative;
   }

   /* 右上「アプリ内」の時計 */
   .app-clock {
     position: absolute;
     top: 20px;
     right: 18vw;
     color: #ffffff;
     font-size: 13px;
     font-weight: 400;
     opacity: 0.9;
     z-index: 10;
   }

   /* 下部固定エリア（赤色エリア相当：フッター＆飛び出しボタン） */
   .footer-fixed {
     width: 100%;
     height: calc(70px + env(safe-area-inset-bottom)); /* フッターバー本体の高さ */
     padding-bottom: env(safe-area-inset-bottom);
     background: url('footer.jpg') no-repeat center bottom;
     background-size: 100% auto;
     flex-shrink: 0;
     z-index: 20;
     position: relative;
   }
</style>
</head>
<body>

<div class="app-container">
  <!-- 上部固定ヘッダー（赤色） -->
  <div class="header-fixed"></div>

  <!-- スクロール可能領域（黄色） -->
  <div class="scroll-content">
    <div class="scroll-bg">
      <!-- リアルタイム更新時計 -->
      <div class="app-clock" id="app-clock">00:00</div>
    </div>
  </div>

  <!-- 下部固定フッター（赤色・中央の丸いボタン含む） -->
  <div class="footer-fixed"></div>
</div>

<script>
   function updateClock() {
     const now = new Date();
     const hours = String(now.getHours()).padStart(2, '0');
     const minutes = String(now.getMinutes()).padStart(2, '0');
     const timeStr = `${hours}:${minutes}`;
     document.getElementById('app-clock').textContent = timeStr;
   }
   setInterval(updateClock, 1000);
   updateClock();
</script>
</body>
</html>
