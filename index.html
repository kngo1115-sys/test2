<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMBC</title>
<style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     user-select: none;
     -webkit-user-select: none;
   }
   html, body {
     width: 100%;
     height: 100%;
     background-color: #01381b;
     overflow: hidden;
     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", sans-serif;
   }
   /* 画面全体を完全に覆い、下部のセーフエリアを無視して引き伸ばす */
   .app-container {
     position: fixed;
     top: 0;
     left: 0;
     width: 100vw;
     /* 100vhに加えて、下部のインジケータの高さ分（env）をプラスして強制的に下まで伸ばす */
     height: calc(100vh + env(safe-area-inset-bottom, 34px));
     background: url('bg.jpg') no-repeat center top;
     /* 縦横比を固定せず、画面全体に完全にフィットさせる */
     background-size: 100% 100%;
   }
   /* 右上「アプリ内」の時計 */
   .app-clock {
     position: absolute;
     top: 22.4vh;
     right: 18vw;
     color: #ffffff;
     font-size: 13px;
     font-weight: 400;
     opacity: 0.9;
     z-index: 10;
   }
</style>
</head>
<body>
<div class="app-container">
  <!-- 右上のリアルタイム更新用テキスト -->
  <div class="app-clock" id="app-clock">00:00</div>
</div>
<script>
   function updateClock() {
     const now = new Date();
     const hours = String(now.getHours()).padStart(2, '0');
     const minutes = String(now.getMinutes()).padStart(2, '0');
     const timeStr = `${hours}:${minutes}`;
     document.getElementById('app-clock').textContent = timeStr;
   }
   setInterval(updateClock, 1000);
   updateClock();
</script>
</body>
</html>
