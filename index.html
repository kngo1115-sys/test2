<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 画面の端（ノッチ・ステータスバー領域含む）まで広げる設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- フルスクリーン（アプリモード）起動の設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMBC</title>
<style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     user-select: none;
     -webkit-user-select: none;
   }
   html, body {
     width: 100%;
     height: 100%;
     background-color: #01381b; /* SMBCの緑色 */
     overflow: hidden;
     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", sans-serif;
   }
   /* 画面全体を完全に覆うコンテナ */
   .app-container {
     position: fixed;
     top: 0;
     left: 0;
     width: 100vw;
     height: 100vh;
     /* 縦横比を無視して画面全体にぴったり引き伸ばす（100% 100%） */
     background: url('bg.jpg') no-repeat center center;
     background-size: 100% 100%;
   }
   /* 右上「アプリ内」の時計 */
   .app-clock {
     position: absolute;
     top: 22.4vh;
     right: 18vw;
     color: #ffffff;
     font-size: 13px;
     font-weight: 400;
     opacity: 0.9;
     z-index: 10;
   }
</style>
</head>
<body>
<div class="app-container">
  <!-- 右上のリアルタイム更新用テキスト -->
  <div class="app-clock" id="app-clock">00:00</div>
</div>
<script>
   function updateClock() {
     const now = new Date();
     const hours = String(now.getHours()).padStart(2, '0');
     const minutes = String(now.getMinutes()).padStart(2, '0');
     const timeStr = `${hours}:${minutes}`;
     document.getElementById('app-clock').textContent = timeStr;
   }
   setInterval(updateClock, 1000);
   updateClock();
</script>
</body>
</html>
